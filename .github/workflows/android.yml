# ─────────────────────────────────────────────────────────────────────────────
# One-Handed Launcher — GitHub Actions CI/CD
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions → New):
#
#   CM_KEYSTORE              base64 of the release keystore file
#   CM_KEYSTORE_PASSWORD     keystore password
#   CM_KEY_ALIAS             onehand
#   CM_KEY_PASSWORD          key password
#
# To encode your keystore to base64 on Windows PowerShell:
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("path\to\keystore.jks")) | Set-Clipboard
#
# Two jobs:
#   1. debug   — debug APK on every push (artifact + included in GitHub Release)
#   2. release — signed release APK + AAB on main/tags; BOTH APKs on Releases page
# ─────────────────────────────────────────────────────────────────────────────

name: Android Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Debug APK ─────────────────────────────────────────────────────────────
  debug:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Dart analysis
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename debug APK
        run: |
          mkdir -p dist
          cp build/app/outputs/apk/debug/app-debug.apk \
             dist/onehand-debug-${{ github.run_number }}.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: dist/onehand-debug-${{ github.run_number }}.apk
          retention-days: 14

  # ── 2. Release AAB + APK (main branch / tags only) ───────────────────────────
  release:
    name: Release APK
    runs-on: ubuntu-latest
    needs: debug
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: dist

      - name: Decode keystore
        env:
          CM_KEYSTORE: ${{ secrets.CM_KEYSTORE }}
        run: |
          KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/onehand-release.keystore
          echo "$CM_KEYSTORE" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: keystore is empty. Check the CM_KEYSTORE secret."
            exit 1
          fi
          echo "CM_KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "Keystore decoded OK."

      - name: Get Flutter packages
        run: flutter pub get

      - name: Dart analysis
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        env:
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}

      - name: Build release AAB
        env:
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}

      - name: Rename release outputs
        run: |
          mkdir -p dist
          cp build/app/outputs/apk/release/app-release.apk \
             dist/onehand-release-${{ github.run_number }}.apk
          cp build/app/outputs/bundle/release/app-release.aab \
             dist/onehand-release-${{ github.run_number }}.aab

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/onehand-release-${{ github.run_number }}.apk
          retention-days: 30

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: dist/onehand-release-${{ github.run_number }}.aab
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
          files: |
            dist/onehand-debug-${{ github.run_number }}.apk
            dist/onehand-release-${{ github.run_number }}.apk
            dist/onehand-release-${{ github.run_number }}.aab
