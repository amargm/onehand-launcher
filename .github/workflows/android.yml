name: Android CI and Play internal release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Dart analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Create temporary release signing key
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/ci-release-test.jks"
          keytool -genkeypair -noprompt \
            -keystore "$keystore_path" \
            -storetype JKS \
            -storepass ci-test-store \
            -keypass ci-test-key \
            -alias ci-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI Release Validation"
          {
            echo "ANDROID_UPLOAD_KEYSTORE_PATH=$keystore_path"
            echo "ANDROID_UPLOAD_KEYSTORE_PASSWORD=ci-test-store"
            echo "ANDROID_UPLOAD_KEY_ALIAS=ci-test"
            echo "ANDROID_UPLOAD_KEY_PASSWORD=ci-test-key"
          } >> "$GITHUB_ENV"

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/apk/debug/app-debug.apk
          retention-days: 14

  play-internal:
    name: Build and upload Play internal release
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: play-internal
    concurrency:
      group: play-internal-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Validate release tag and version code
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH (for example, v1.0.1)." >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( ${#major} > 4 || ${#minor} > 3 || ${#patch} > 3 )); then
            echo "Version components exceed the supported Android versionCode range." >&2
            exit 1
          fi
          if (( major > 2099 || minor > 999 || patch > 999 )); then
            echo "Version components exceed the supported Android versionCode range." >&2
            exit 1
          fi

          version_name="$major.$minor.$patch"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code <= 1 || version_code > 2100000000 )); then
            echo "The derived versionCode must be between 2 and 2100000000." >&2
            exit 1
          fi

          pubspec_version="$(sed -nE "s/^version:[[:space:]]*['\"]?([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)['\"]?$/\1 \2/p" pubspec.yaml)"
          if [[ -z "$pubspec_version" ]]; then
            echo "pubspec.yaml version must use MAJOR.MINOR.PATCH+VERSION_CODE." >&2
            exit 1
          fi
          read -r pubspec_name pubspec_code <<< "$pubspec_version"
          if [[ "$pubspec_name" != "$version_name" || "$pubspec_code" != "$version_code" ]]; then
            echo "Tag $GITHUB_REF_NAME must match pubspec.yaml version ${version_name}+${version_code}." >&2
            exit 1
          fi

          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Validate release credentials
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS \
            ANDROID_UPLOAD_KEY_PASSWORD \
            PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub environment secret $name is missing." >&2
              exit 1
            fi
          done

      - name: Decode upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/onehand-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build signed release AAB
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: >-
          flutter build appbundle --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: onehand-${{ steps.version.outputs.name }}.aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play internal testing
        uses: r0adkll/upload-google-play@744d577ff543375f35f60408e13fb32c7caa90ce
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.onehand.onehand_launcher
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          releaseName: ${{ steps.version.outputs.name }}
          status: completed
