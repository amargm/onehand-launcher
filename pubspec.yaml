name: onehand_launcher
description: "One-Handed Minimalist Launcher — Ergonomic Android launcher with Obsidian Pulse aesthetic."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Persist settings (accent color, folders)
  shared_preferences: ^2.3.5

  # Sora font
  google_fonts: ^6.2.1

  # Runtime permissions (QUERY_ALL_PACKAGES)
  permission_handler: ^11.3.1

  # Accent color picker in settings
  flutter_colorpicker: ^1.1.0

  # UUID generation for folder IDs
  uuid: ^4.5.1

  # Wallpaper picker — network image display with disk cache
  cached_network_image: ^3.4.1

  # Download wallpaper bytes to pass to WallpaperManager
  http: ^1.2.2

  # Resolve app documents directory to store wallpaper files
  path_provider: ^2.1.4

  # Location for country detection (holiday calendar)
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true



  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
