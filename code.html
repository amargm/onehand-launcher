<body class="text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary" style="background-color: rgb(0, 0, 0);">
<!-- Top App Bar (Shared Component Style) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 py-4 bg-transparent">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: &quot;FILL&quot; 1;">signal_cellular_alt</span>
<span class="font-headline-md text-headline-md font-bold tracking-tight">OS_ONE</span>
</div>

</header>
<main class="relative min-h-screen w-full flex flex-col items-center pt-[25vh] pb-safe-bottom-area overflow-hidden">
<!-- Large Clock Display -->
<section class="mb-12 items-start pl-8 w-full">
<h1 class="font-display-lg text-[64px] leading-tight tracking-tighter opacity-80">12:48</h1>
<p class="font-label-sm mt-1 uppercase tracking-widest text-on-surface/60">Tuesday, Oct 24</p>
</section>
<!-- Dynamic Apps Grid (Pushed by Context) -->
<!-- Concentric Dock System -->
<section class="fixed bottom-8 flex flex-col items-center z-40 w-fit">
<!-- Context-Aware Background (The Outer Shell) -->
<div class="rounded-[48px] p-2 border border-outline-variant/20 shadow-2xl transition-all duration-700 w-fit" style="background-color: #121212;">
<!-- Secondary Contextual Icons (The "Outside" Icons) -->
<div class="flex justify-around items-center px-6 py-4 gap-4">
<div class="flex items-center justify-center w-8 h-8 rounded-full border bg-surface-variant border-outline-variant/50">
<span class="material-symbols-outlined text-primary-container text-lg">bluetooth</span>
</div>
<div class="flex items-center justify-center w-8 h-8 rounded-full border bg-surface-variant border-outline-variant/50">
<span class="material-symbols-outlined text-primary-container text-lg">wifi</span>
</div>
<div class="flex items-center justify-center w-8 h-8 rounded-full border bg-surface-variant border-outline-variant/50">
<span class="material-symbols-outlined text-primary-container text-lg">flight</span>
</div>
<div class="flex items-center justify-center w-8 h-8 rounded-full border bg-surface-variant border-outline-variant/50">
<span class="material-symbols-outlined text-primary-container text-lg">bedtime</span>
</div>
</div>
<!-- Inner Dock (The Focus Control) -->
<div class="rounded-[40px] px-4 py-4 flex items-center shadow-lg justify-center gap-4" style="background-color: #1e1e1e;">
<div class="flex gap-4">
<!-- Folder Buttons -->
<div class="w-14 h-14 bg-surface-container flex items-center justify-center hover:bg-surface-variant transition-all active:scale-90 border border-outline-variant/10 rounded-full">
<span class="material-symbols-outlined text-on-surface-variant">grid_view</span>
</div>
<div class="w-14 h-14 bg-surface-container flex items-center justify-center hover:bg-surface-variant transition-all active:scale-90 border border-outline-variant/10 rounded-full">
<span class="material-symbols-outlined text-on-surface-variant">folder</span>
</div>
<div class="w-14 h-14 bg-surface-container flex items-center justify-center hover:bg-surface-variant transition-all active:scale-90 border border-outline-variant/10 rounded-full">
<span class="material-symbols-outlined text-on-surface-variant">group</span>
</div>
</div>
<!-- Rightmost Search Icon -->
<div class="w-14 h-14 bg-primary-container flex items-center justify-center shadow-[0_0_20px_rgba(255,87,34,0.3)] hover:opacity-90 active:scale-90 transition-all rounded-full shadow-[0_0_20px_rgba(255,255,255,0.1)]">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: &quot;FILL&quot; 1;">search</span>
</div>
</div>
</div>
</section>
<!-- Search Result Mockup (Hidden/Overlay State Simulation) -->
<section class="fixed inset-0 z-[60] bg-background/80 backdrop-blur-md pointer-events-none opacity-0 flex flex-col justify-end">
<!-- This area is purely representational as per prompt requirements for a keyboard/results mockup -->
<div class="w-full bg-surface-container-high rounded-t-[40px] p-6 pointer-events-auto">
<!-- Search Input Bar -->
<div class="relative w-full mb-8">
<input class="w-full bg-background border border-outline-variant rounded-full py-4 px-12 text-on-surface focus:border-primary-container focus:ring-0" placeholder="Search apps, people, files..." type="text">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
</div>
<!-- Results Area (2-row horizontal) -->
<div class="flex flex-col gap-4 mb-8">
<!-- Top Row (Left to Right, but results ordered bottom-right priority conceptually) -->
<div class="flex gap-4 overflow-x-auto pb-2 no-scrollbar">
<div class="flex-none w-20 flex flex-col items-center gap-1 opacity-40">
<div class="w-16 h-16 rounded-2xl bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined">settings</span>
</div>
<span class="text-[10px] font-label-sm">Settings</span>
</div>
<div class="flex-none w-20 flex flex-col items-center gap-1 opacity-60">
<div class="w-16 h-16 rounded-2xl bg-surface-container flex items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined">description</span>
</div>
<span class="text-[10px] font-label-sm">Resume.pdf</span>
</div>
</div>
<!-- Bottom Row (Bottom-Right is most relevant) -->
<div class="flex gap-4 overflow-x-auto pb-2 no-scrollbar flex-row-reverse">
<!-- Most Relevant -->
<div class="flex-none w-20 flex flex-col items-center gap-1">
<div class="w-16 h-16 rounded-2xl bg-primary-container flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-on-primary">mail</span>
</div>
<span class="text-[10px] font-label-sm text-primary">Gmail</span>
</div>
<div class="flex-none w-20 flex flex-col items-center gap-1">
<div class="w-16 h-16 rounded-2xl bg-surface-container-highest flex items-center justify-center border border-primary-container/40">
<span class="material-symbols-outlined">contact_page</span>
</div>
<span class="text-[10px] font-label-sm">Alex Chen</span>
</div>
</div>
</div>
<!-- Keyboard Mockup Area -->
<div class="w-full aspect-[4/3] bg-surface-container-lowest/50 rounded-t-[32px] p-4 grid grid-rows-4 gap-2">
<!-- Representational keys -->
<div class="flex gap-1 justify-center"><div class="flex-1 bg-surface-container rounded-lg h-10"></div><div class="flex-1 bg-surface-container rounded-lg h-10"></div><div class="flex-1 bg-surface-container rounded-lg h-10"></div><div class="flex-1 bg-surface-container rounded-lg h-10"></div><div class="flex-1 bg-surface-container rounded-lg h-10"></div></div>
<div class="flex gap-1 justify-center px-4"><div class="flex-1 bg-surface-container rounded-lg h-10"></div><div class="flex-1 bg-surface-container rounded-lg h-10"></div><div class="flex-1 bg-surface-container rounded-lg h-10"></div><div class="flex-1 bg-surface-container rounded-lg h-10"></div><div class="flex-1 bg-surface-container rounded-lg h-10"></div></div>
<div class="flex gap-1 justify-center"><div class="w-12 bg-surface-container-highest rounded-lg h-10"></div><div class="flex-1 bg-surface-container rounded-lg h-10"></div><div class="flex-1 bg-surface-container rounded-lg h-10"></div><div class="flex-1 bg-surface-container rounded-lg h-10"></div><div class="w-12 bg-surface-container-highest rounded-lg h-10"></div></div>
<div class="flex gap-1 justify-center"><div class="w-14 bg-surface-container-highest rounded-lg h-10"></div><div class="flex-[3] bg-surface-container rounded-lg h-10"></div><div class="w-14 bg-primary-container rounded-lg h-10 flex items-center justify-center"><span class="material-symbols-outlined text-sm">subdirectory_arrow_left</span></div></div>
</div>
</div>
</section>

<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-[150%] h-[20vh] bg-gradient-to-t from-primary-container/10 to-transparent blur-3xl pointer-events-none z-0"></div>
